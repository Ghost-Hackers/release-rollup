[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "release-rollup"
version = "0.2.0b3"
description = "Roll old release and pre-release folders up into verified, deduplicated zips"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.14"
dependencies = []

[project.urls]
Homepage = "https://github.com/Ghost-Hackers/release-rollup"
Issues = "https://github.com/Ghost-Hackers/release-rollup/issues"
Changelog = "https://github.com/Ghost-Hackers/release-rollup/blob/master/CHANGELOG.md"

[project.scripts]
release-rollup = "release_rollup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
release_rollup = ["VERSION"]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
extraPaths = ["src", "tools"]

# Read by tools/check.sh; lines that can't be covered are listed in tools/coverage_exclusions.tsv.
[tool.coverage.run]
branch = true
source_pkgs = ["release_rollup"]
patch = ["subprocess"]

[tool.coverage.paths]
release_rollup = ["src/release_rollup", "*/rr-noversion-*/release_rollup"]

[tool.coverage.report]
show_missing = true
