[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "release-rollup"
version = "0.2.0b2"
description = "Roll old release and pre-release folders up into verified, deduplicated zips"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.14"
dependencies = []

[project.urls]
Homepage = "https://github.com/Ghost-Hackers/release-rollup"
Issues = "https://github.com/Ghost-Hackers/release-rollup/issues"
Changelog = "https://github.com/Ghost-Hackers/release-rollup/blob/master/CHANGELOG.md"

[project.scripts]
release-rollup = "release_rollup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
release_rollup = ["VERSION"]

[tool.pyright]
include = ["src", "tests", "tools"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
