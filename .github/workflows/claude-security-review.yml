name: Claude security review

on:
  issue_comment:
    types: [created]
  workflow_call:

permissions:
  contents: read

jobs:
  security:
    name: Claude security review
    # Started by a comment "@claude security review" on a pull request.
    if: github.event.issue.pull_request && contains(github.event.comment.body, '@claude security review')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Check the Claude secret
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OAUTH_TOKEN" ] && [ -z "$API_KEY" ]; then
            echo "::error::Set CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY as an org secret"
            exit 1
          fi
      - id: claude
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude security review"
          restrict_untrusted_prs: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.issue.number }}

            Do a security review of this pull request. Read .github/REVIEWING.md first. Read the diff and the code it touches; don't run anything from the checkout.

            Look for:
            - paths from zips, manifests or arguments that can reach outside the target folder: `..`, absolute paths, drive letters, links, junctions, names Windows can't hold
            - input built to exhaust memory or disk: huge counts, nested zips, sizes that lie
            - files read, written, moved or trashed without the check that should come first, and any way to lose a user's release files
            - workflows: injection from pull request titles, branch names or comments into run steps, more permissions than a job needs, actions not pinned to a commit, secrets reachable from forks
            - secrets, tokens, personal information or home folder paths in the diff
            - checks that can pass without running, or tests that only exercise mocks

            Each finding is an inline comment starting with [P1], [P2] or [P3], saying what an attacker or a bad input could do and what to change. Finish with one comment, "Security review: no findings" or "Security review: N findings (P1: a, P2: b, P3: c)", and the list.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*)"
      - name: Check that Claude ran
        if: always() && steps.claude.outcome != 'skipped'
        env:
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
        run: |
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Claude finished with '${CONCLUSION:-nothing}', not success"
            exit 1
          fi
