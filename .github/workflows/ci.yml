name: CI

on:
  # Every push to any branch is checked, forks included, and pull requests are checked again
  # against master before they can be merged.
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  # A pull request's runs share one group, so a newer push cancels the older run.
  # Every other run gets a group of its own: GitHub keeps only one pending run per
  # group and drops the rest, which would lose results for quick pushes to master.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Show the Python version
        run: python --version

      - name: Install coverage.py
        run: python -m pip install coverage==7.17.3

      # Some tests fill a real disk (tests/smallfs.py). They need RR_SMALLFS, a folder on a
      # filesystem of a few MB, and fail without it. Both steps below export it for the later steps.
      - name: Make a small filesystem for the disk-full tests (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p "$RUNNER_TEMP/small"
          sudo mount -t tmpfs -o size=4m,mode=1777 tmpfs "$RUNNER_TEMP/small"
          df -h "$RUNNER_TEMP/small"
          echo "RR_SMALLFS=$RUNNER_TEMP/small" >> "$GITHUB_ENV"

      - name: Make a small filesystem for the disk-full tests (Windows)
        # An 8 MB fixed VHD, formatted NTFS and given drive S:. The runner is an administrator,
        # which diskpart needs.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'small.vhd'
          $script = Join-Path $env:RUNNER_TEMP 'small.diskpart'
          @(
            "create vdisk file=`"$vhd`" maximum=8 type=fixed"
            "select vdisk file=`"$vhd`""
            'attach vdisk'
            'create partition primary'
            'format fs=ntfs quick label=small'
            'assign letter=S'
          ) | Set-Content -Encoding ascii $script
          diskpart /s $script
          if ($LASTEXITCODE -ne 0) { throw "diskpart failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Path 'S:\tests' | Out-Null
          Get-PSDrive S
          "RR_SMALLFS=S:\tests" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Make a filesystem without hard links (Windows)
        # 64 MB FAT32 drive T:. FAT has no hard links, so NoHardLinks in tests/test_edges.py
        # tests the copy fallback.
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vhd = Join-Path $env:RUNNER_TEMP 'nolinks.vhd'
          $script = Join-Path $env:RUNNER_TEMP 'nolinks.diskpart'
          @(
            "create vdisk file=`"$vhd`" maximum=64 type=fixed"
            "select vdisk file=`"$vhd`""
            'attach vdisk'
            'create partition primary'
            'format fs=fat32 quick label=nolinks'
            'assign letter=T'
          ) | Set-Content -Encoding ascii $script
          diskpart /s $script
          if ($LASTEXITCODE -ne 0) { throw "diskpart failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Path 'T:\tests' | Out-Null
          Get-PSDrive T
          "RR_NOLINKS_FS=T:\tests" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run the unit tests
        # The summary must be a bare OK. "OK (skipped=N)" fails the job: every test
        # has to run on both systems. Output from the tests can follow the summary,
        # so this looks for the summary line anywhere instead of only the last line.
        run: |
          mkdir -p logs
          PYTHONPATH=src python -m unittest discover -s tests -v > logs/unit.log 2>&1 || { tail -n 40 logs/unit.log; exit 1; }
          grep -E '^Ran [0-9]+ tests' logs/unit.log
          tr -d '\r' < logs/unit.log > logs/unit.clean
          if grep -qE '^OK \(' logs/unit.clean || grep -qE ' \.\.\. skipped ' logs/unit.clean || ! grep -qx 'OK' logs/unit.clean; then
            echo "unit tests: the summary is not a bare OK (skipped or missing)"
            grep -E '^OK|\.\.\. skipped ' logs/unit.clean | head -n 20
            exit 1
          fi

      - name: Run check.sh
        run: PY=python bash tools/check.sh 2>&1 | tee logs/check.log

      - name: Build the release zip from this commit
        run: |
          V=$(cat VERSION)
          mkdir -p dist
          git archive --prefix=release-rollup-$V/ -o dist/release-rollup-$V.zip HEAD

      - name: Download the newest 0.1.x release zip
        # For the --cross check below. Forks have no releases, so always fetch from upstream.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list -R Ghost-Hackers/release-rollup --exclude-pre-releases --exclude-drafts --limit 100 \
            --json tagName --jq '[.[].tagName | select(test("^v0\\.1\\.[0-9]+$"))] | sort_by(ltrimstr("v") | split(".") | map(tonumber)) | last')
          [ -n "$tag" ] && [ "$tag" != null ] || { echo "no 0.1.x release found"; exit 1; }
          echo "cross-checking against $tag"
          gh release download "$tag" -R Ghost-Hackers/release-rollup --pattern "release-rollup-${tag#v}.zip" -D old
          echo "OLD_ZIP=old/release-rollup-${tag#v}.zip" >> "$GITHUB_ENV"

      - name: Run the end-to-end checks
        run: |
          V=$(cat VERSION)
          PY=python bash tools/e2e.sh dist/release-rollup-$V.zip 2>&1 | tee logs/e2e.log

      - name: Run the end-to-end checks against the newest 0.1.x
        run: |
          V=$(cat VERSION)
          PY=python bash tools/e2e.sh dist/release-rollup-$V.zip --cross "$OLD_ZIP" 2>&1 | tee logs/e2e-cross.log

      - name: Run the end-to-end self-check
        # Proves the e2e script fails on a zip with one changed byte.
        run: |
          V=$(cat VERSION)
          PY=python bash tools/e2e.sh --self-check dist/release-rollup-$V.zip 2>&1 | tee logs/e2e-self.log

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.os }}
          path: logs/
          if-no-files-found: ignore

  types:
    name: Pyright strict
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - name: Run Pyright
        # Settings come from [tool.pyright] in pyproject.toml. Any error fails the job.
        run: npx --yes pyright@1.1.414
