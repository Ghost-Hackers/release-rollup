name: CI

on:
  # Pull requests are checked on every push to their branch, before they can be merged.
  # Pushes to master and the release branches run again after a merge.
  push:
    branches: [master, "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  # A pull request's runs share one group, so a newer push cancels the older run.
  # Every other run gets a group of its own: GitHub keeps only one pending run per
  # group and drops the rest, which would lose results for quick pushes to a branch.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Show the Python version
        run: python --version

      - name: Run the unit tests
        # The summary must be a bare OK. "OK (skipped=N)" fails the job: every test
        # has to run on both systems. Output from the tests can follow the summary,
        # so this looks for the summary line anywhere instead of only the last line.
        run: |
          mkdir -p logs
          PYTHONPATH=src python -m unittest discover -s tests -v > logs/unit.log 2>&1 || { tail -n 40 logs/unit.log; exit 1; }
          grep -E '^Ran [0-9]+ tests' logs/unit.log
          tr -d '\r' < logs/unit.log > logs/unit.clean
          if grep -qE '^OK \(' logs/unit.clean || grep -qE ' \.\.\. skipped ' logs/unit.clean || ! grep -qx 'OK' logs/unit.clean; then
            echo "unit tests: the summary is not a bare OK (skipped or missing)"
            grep -E '^OK|\.\.\. skipped ' logs/unit.clean | head -n 20
            exit 1
          fi

      - name: Run check.sh
        run: PY=python bash tools/check.sh 2>&1 | tee logs/check.log

      - name: Upload the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.os }}
          path: logs/
          if-no-files-found: ignore
