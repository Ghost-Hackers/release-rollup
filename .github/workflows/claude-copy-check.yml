name: Claude copy check

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    name: Claude copy check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check that the copied Claude workflows weren't edited
        run: python3 .github/scripts/check_copy.py
