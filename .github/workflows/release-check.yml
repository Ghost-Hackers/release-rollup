name: Release check

on:
  # The pull request job always runs so it can be a required check. It passes by itself
  # when the pull request carries the "no changelog" label, so label changes rerun it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  changelog:
    name: Changelog entry
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the pull request with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Read the labels
        id: labels
        # From the API, not the event: the "opened" event can come before the labels it was
        # opened with are added. Opening with a label also starts a run for "labeled", and a
        # failed or cancelled run of a required check blocks the merge even when a newer one
        # passed, so the "opened" run gives the labels 20 seconds to arrive.
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: |
          labels=$(gh pr view "$NUMBER" -R "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          if [ "$ACTION" = opened ] && [ -z "$labels" ]; then
            sleep 20
            labels=$(gh pr view "$NUMBER" -R "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')
          fi
          if grep -qxF 'no changelog' <<<"$labels"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the changelog entry
        # A change under src/ needs a new line under "## [Unreleased]" unless the
        # pull request has the "no changelog" label.
        if: steps.labels.outputs.skip == 'false'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: python tools/check_release.py changelog --base "origin/$BASE_REF" --head HEAD

      - name: Skip the changelog entry
        if: steps.labels.outputs.skip == 'true'
        run: echo 'The pull request has the "no changelog" label, so no entry is needed.'

      - name: Check the version numbers
        run: python tools/check_release.py versions

  tag:
    name: Release versions
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Check the version numbers against the tag
        env:
          TAG: ${{ github.ref_name }}
        run: python tools/check_release.py versions --tag "$TAG"
