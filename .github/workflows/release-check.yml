name: Release check

on:
  # The pull request job always runs so it can be a required check. The changelog check has its
  # own workflow, changelog-check.yml.
  pull_request:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  versions:
    name: Version numbers
    # VERSION, pyproject.toml and the CHANGELOG.md heading for the version have to agree.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Check the version numbers
        run: python tools/check_release.py versions

  tag:
    name: Release versions
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Check the version numbers against the tag
        env:
          TAG: ${{ github.ref_name }}
        run: python tools/check_release.py versions --tag "$TAG"
