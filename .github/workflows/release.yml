name: Release

# Pushing a version tag builds the release zip from that tag, attests it and opens a draft
# release with the zip and SHA256SUMS attached. The notes are written and the draft is
# published by hand.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  # One run per tag, never cancelled: a half-finished release run is worse than a slow one.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write          # asks Sigstore for the signing certificate
      attestations: write      # stores the attestation with the repository
      artifact-metadata: write # records the zip as an artifact of this run
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Check the version numbers against the tag
        env:
          TAG: ${{ github.ref_name }}
        run: python tools/check_release.py versions --tag "$TAG"

      - name: Install coverage.py
        run: python -m pip install coverage==7.17.3

      # check.sh's disk-full tests need RR_SMALLFS, a folder on a filesystem of a few MB.
      - name: Make a small filesystem for the disk-full tests
        run: |
          mkdir -p "$RUNNER_TEMP/small"
          sudo mount -t tmpfs -o size=4m,mode=1777 tmpfs "$RUNNER_TEMP/small"
          echo "RR_SMALLFS=$RUNNER_TEMP/small" >> "$GITHUB_ENV"

      - name: Run the tests
        run: PY=python bash tools/check.sh

      - name: Build the release zip
        run: python tools/build_release.py --out dist

      - name: Attest the zip
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.zip

      - name: Keep the files for the release job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # creates the draft release and uploads its files
    steps:
      - name: Get the built files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist

      - name: Check the files against SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS

      - name: Open a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version=${TAG#v}
          pre=()
          case "$version" in *-*) pre=(--prerelease) ;; esac
          gh release create "$TAG" dist/* --draft --verify-tag "${pre[@]}" \
            --title "release-rollup $version" \
            --notes "Draft. The release notes go here before this is published."
