name: Claude review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  workflow_call:

permissions:
  contents: read

# A newer push replaces the review still running for the same pull request.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude review
    # Forks are skipped: their code must not run with the org's token. A maintainer can ask with "@claude review".
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Check the Claude secret
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$OAUTH_TOKEN" ] && [ -z "$API_KEY" ]; then
            echo "::error::Set CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY as an org secret"
            exit 1
          fi
      - id: claude
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          additional_permissions: |
            actions: read
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD: ${{ github.event.pull_request.head.sha }}

            Review this pull request. Read .github/REVIEWING.md first: it holds the project's rules, and a change that breaks one is a finding.

            Before commenting, read the review threads already on the pull request. Don't raise a point again that is resolved or already open; if a new commit fixes an open point, say so in that thread.

            Report only real problems, each as an inline comment on the line it is about, starting with its severity:
            - [P1] data loss or damage, a security hole, or a wrong result
            - [P2] a bug in a less common case, a missing test, or a rule from REVIEWING.md broken
            - [P3] docs, comments or wording
            Say plainly what is wrong and what to change. Where the fix is a few lines, add it as a GitHub suggestion block. No praise and no summary of what the pull request does.

            If a check on HEAD failed, read its log with gh run view --log-failed and say in one comment why it failed.

            Finish by setting the summary comment to one line, "Review: no findings" or "Review: N findings (P1: a, P2: b, P3: c)", followed by the findings as a short list.
          claude_args: |
            --model claude-sonnet-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh api:*)"
      - name: Check that Claude ran
        if: always() && steps.claude.outcome != 'skipped'
        env:
          CONCLUSION: ${{ steps.claude.outputs.conclusion }}
        run: |
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::Claude finished with '${CONCLUSION:-nothing}', not success"
            exit 1
          fi
