name: CodeQL

on:
  push:
    branches: [master, "release/**"]
  pull_request:
  schedule:
    # Mondays at 04:17 UTC, so new queries also run against code that hasn't changed.
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  # A pull request's runs share one group, so a newer push cancels the older run.
  # Every other run gets a group of its own: GitHub keeps only one pending run per
  # group and drops the rest, which would lose results for quick pushes to a branch.
  group: codeql-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # actions scans the workflow files for script injection and over-broad tokens.
        language: [python, actions]
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Neither language needs a build step, so CodeQL reads the files as they are.
      - name: Set up CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Run the analysis
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
