name: Feature request
description: A new command, option or behavior.
labels: ["feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you're trying to do
      description: The situation and the folder layout you're working with, and where release-rollup falls short today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like it to do
      description: The command or option you have in mind and what it should produce. Example output is welcome.
    validations:
      required: true
  - type: textarea
    id: workaround
    attributes:
      label: What you do now
      description: Any workaround you use today, if there is one.
