name: Bug report
description: release-rollup did something wrong, or something the docs say it shouldn't.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. Security problems go through private reporting instead (Security tab, "Report a vulnerability"), so please don't put them here.
  - type: input
    id: version
    attributes:
      label: release-rollup version
      description: Output of `release-rollup --version` (or `python3 -m release_rollup --version`).
      placeholder: release-rollup 0.1.0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options:
        - Linux
        - Windows 11 (Git Bash)
        - Windows 11 (PowerShell or cmd)
        - Other (say which below)
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python3 --version`, or `py -3.14 --version` on Windows.
      placeholder: Python 3.14.6
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command you ran
      description: The full command line, and the folder layout it ran on if it matters (a `tree` or `ls -R` of the releases or prereleases folder is plenty).
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What it printed
      description: The complete output, including any `error:` line, and the exit code (`echo $?` right after the command).
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: What should have happened instead.
    validations:
      required: true
  - type: dropdown
    id: dry-run
    attributes:
      label: Does --dry-run show the same problem?
      options:
        - "Yes"
        - "No, only the real run"
        - Didn't try
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Whether files were changed, trashed or left behind, and anything that helps reproduce it.
